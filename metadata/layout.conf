masters = gentoo
thin-manifests = true
sign-manifests = false

# Needed for profiles parent with repo syntax
profile-formats = portage-2

# Gentoo's own layout.conf whitelists RESTRICT values and doesn't include
# network-sandbox; add it here (unioned with the inherited list) for ebuilds
# with an npm/cargo-style build step that can't be vendored offline.
restrict-allowed = binchecks bindist fetch installsources mirror preserve-libs splitdebug strip test userpriv network-sandbox
